name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  rust-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            wget

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile check
        # `--locked` fails the build if Cargo.lock would have to change, so a
        # release is always built from the exact dependency set in the repo.
        run: cargo check --locked --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  app-build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            wget

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"

      - name: Generate bundle icons
        run: cargo tauri icon icons/icon.png

      - name: Build Linux bundles (deb + AppImage)
        run: cargo tauri build --bundles deb,appimage

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: mediavault-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  app-build:
    runs-on: macos-latest

    # Job-level env so the signing step's `if:` can actually see the secret.
    # Evaluated in the job context, a step-level `env:` is always empty there,
    # which silently skipped the certificate import on every run.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"

      - name: Generate bundle icons
        run: cargo tauri icon icons/icon.png

      - name: Import Apple certificate
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Build macOS app bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: cargo tauri build --bundles app

      - name: Ad-hoc sign app bundle
        # Only when no Developer ID was imported — otherwise this would replace
        # the real signature with an ad-hoc one.
        # Ad-hoc signing ("-") prevents the "app is damaged" Gatekeeper error.
        # Without a Developer ID, macOS will show "unidentified developer" instead,
        # which users can bypass with right-click → Open (or xattr -cr).
        if: ${{ env.APPLE_CERTIFICATE == '' }}
        run: |
          codesign --force --deep --sign - \
            target/release/bundle/macos/MediaVault.app

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "MediaVault" \
            -srcfolder target/release/bundle/macos/MediaVault.app \
            -ov -format UDZO \
            MediaVault.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: mediavault-macos
          path: MediaVault.dmg
          if-no-files-found: error
